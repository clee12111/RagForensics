[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "production-rag-forensics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pinecone",
    "langgraph",
    "langchain-core",
    "langfuse",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "python-dotenv",
    "pydantic",
]

[project.optional-dependencies]
