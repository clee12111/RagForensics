[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "production-rag-forensics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pinecone",
    "langgraph",
    "langchain-core",
    "langfuse",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "python-dotenv",
    "pydantic",
    "tiktoken",
    "tenacity",
    "openai",
    "google-genai",
    "sentence-transformers",
]

[project.optional-dependencies]

[tool.hatch.build.targets.wheel]
packages = ["src/production_rag_forensics"]
